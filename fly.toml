app = "tourism-frontend"
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "433"

[http_service]
  internal_port = 433
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[vm]]
  memory = "256md"
  cpu_kind = "shared"
  cpus = 1
