# fly.toml app configuration file generated for tourism-frontend on 2026-04-15T04:47:21Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'tourism-frontend'
primary_region = 'bom'

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

[build.args]
  VITE_API_URL = "https://tourism-backend.fly.dev"
